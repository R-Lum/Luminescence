# CI GitHub Action ... adapted from usethis::use_github_actions()
on:
  push:
    branches: [master, dev_*]

  pull_request:
    branches: [master, dev_*]

name: GitHub Actions CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

## change if caches needs to be refreshed
env:
  cache-version: v1

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          #- {os: windows-latest, r: 'devel', not_cran: 'true'}
          #- {os: macos-13,   r: 'release', not_cran: 'true'}
          - {os: ubuntu-latest,   r: 'release', not_cran: 'true'}
    env:
      _R_CHECK_FORCE_SUGGESTS_: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - if: runner.os == 'macOS'
        run: brew install jags

      - name: Install JAGS on Windows
        if: runner.os == 'windows'
        run: |
          curl --progress-bar -s -o 'C:\JAGS-4.3.1.exe' -L 'https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.1.exe'
          C:\JAGS-4.3.1.exe /S

      - name: Install JAGS 5
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran liblapack-dev libopenblas-dev

          wget -O /tmp/JAGS-5.0.2.tar.gz \
            https://downloads.sourceforge.net/project/mcmc-jags/JAGS/5.x/Source/JAGS-5.0.2.tar.gz
          tar -xzf /tmp/JAGS-5.0.2.tar.gz -C /tmp

          cd /tmp/JAGS-5.0.2
          ./configure
          make -j2
          sudo make install
          sudo ldconfig

          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig pkg-config --modversion jags

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
